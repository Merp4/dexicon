version: 2

# Weekly rather than daily. A dependency bot that opens more pull requests than anyone
# reads trains people to close them unread, which is worse than not having one.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the framework, which moves in lockstep and is pointless to review
      # package by package.
      dotnet:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.EntityFrameworkCore*"
          # Microsoft.Extensions.ApiDescription.Server writes the OpenAPI document and failed
          # against a Microsoft.AspNetCore.OpenApi one release behind it (#257).
          - "Microsoft.AspNetCore.*"
      ai:
        patterns:
          - "Microsoft.Extensions.AI*"
          - "Azure.AI.OpenAI"
          - "OllamaSharp"
      test:
        patterns:
          - "xunit*"
          - "Shouldly"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # These packages are versioned with the .NET runtime, so a new major is the next .NET's and
      # moves with the target framework (net10.0 in Directory.Build.props), by hand. The 11.0.0
      # bumps proposed on 2026-11-14 show why: Microsoft.Extensions.ApiDescription.Server 11.0.0
      # starts the app on the 11.0 runtime to write the OpenAPI document, so the build fails on
      # 10.0 (#334), and Microsoft.Extensions.AI 11.0.0 ships with .NET 11 (#335). Minor and patch
      # updates still arrive.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      # Microsoft.CodeAnalysis.CSharp 5.1 and later conflict with Microsoft.EntityFrameworkCore.Design,
      # which pulls Microsoft.CodeAnalysis.CSharp.Workspaces 5.0.0 and requires exactly 5.0.0
      # (NU1107, #338). Remove this when the EF Core Design release in use accepts a newer Roslyn.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /clients/web-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      build:
        patterns: ["vite", "@vitejs/*", "tailwindcss", "@tailwindcss/*"]
      # vitest and its @vitest/* companions peer-require each other at an exact
      # version; bumped in separate PRs, each fails npm ci against the other.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Separate from build: a typescript major can outpace what a tool bundling
      # the compiler API (@hey-api/openapi-ts) supports, and that should not also
      # hold back vite or tailwind.
      typescript:
        patterns: ["typescript"]
    ignore:
      # TypeScript 7 ships a native compiler without the JavaScript API that
      # @hey-api/openapi-ts reads (ts.SyntaxKind), so the client generation fails and with it
      # the build. The peer range of @hey-api/openapi-ts 0.99.0 ends at 6.x. Updates to 7 and
      # later are skipped; 6.x updates still arrive. Remove this when openapi-ts supports 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # The base images are digest-pinned; this is what tells us a digest has moved.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The UI build stage follows the Node line CI uses (node-version in ci.yml). #79 moved
      # it from 22 to 25, a non-LTS line that reached end of life in June 2026, because
      # Dependabot proposes the next major whatever its support status. The line is now 26 (LTS
      # until April 2029). Digest and patch updates still arrive. Move to a newer LTS by hand,
      # in the Dockerfile and CI together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # The .NET images move with the target framework (net10.0 in Directory.Build.props), the
      # SDK band in global.json and dotnet-version in ci.yml. A bump of the two images to 11.0
      # leaves those three at 10, and the Dockerfile copies no global.json, so nothing in the
      # image build holds the SDK to 10. Digest and patch updates still arrive. Move to a newer
      # .NET by hand, in all four places together.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
