name: CI

# Every push and every pull request. docs/11-roadmap.md put CI in M1 — "before any
# features" — and it did not land until M2 was largely built, which is exactly the order
# the note warned against. This is that debt paid.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an older run on the same ref. Nobody reads the result of a
  # build for a commit that has already been replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from the nearest tag, and a shallow clone has
          # neither history nor tags — so without this every CI build would version
          # itself 0.0.0-alpha.0.
          fetch-depth: 0

      # A shell script with CRLF endings is not a shell script: `sh` reads the trailing
      # carriage return as part of the last argument, so `set -euo pipefail` becomes an
      # illegal option and the container it was entrypointing crash-loops. That has
      # happened once, to scripts/provision-models.sh, taking Ollama and the app with it.
      #
      # .gitattributes already declares `*.sh text eol=lf`, but that governs what git
      # writes on checkout and stores on commit. It does NOT stop an editor, a generator
      # or a stray script from writing CRLF into a working-tree file that compose then
      # bind-mounts straight into a container. This catches that.
      - name: Shell scripts are LF
        run: |
          bad=$(grep -rlU --include='*.sh' --exclude-dir=node_modules "$(printf '\r')" . || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings in shell scripts - sh cannot run these:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/web-ui/package-lock.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors in this solution (Directory.Build.props), so a build that
      # succeeds here is a build with no warnings either.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      # The build writes clients/web-ui/Dexicon.json and, beside it, the integration
      # document. The UI's TypeScript client is generated from the first of them,
      # including inside the Docker image, which copies the COMMITTED one. So a contract
      # change with an uncommitted document produces an image whose UI is typed against
      # the previous API, and nothing else notices.
      - name: The committed OpenAPI documents match the code
        run: |
          # Compared with `info.version` set aside, because that field is STAMPED by
          # MinVer from the git tag rather than authored, and on a release it is the one
          # thing that cannot agree. A minor bump has to commit the document carrying the
          # version it is about to be tagged with, while an untagged build of that same
          # commit still produces the previous one. Comparing it deadlocked 0.3.0: the
          # check could not pass until the tag existed and the tag could not exist until
          # the merge, which a required status check refuses.
          #
          # Nothing is lost. What this guard is for is the CONTRACT -- the paths and
          # schemas the UI's TypeScript client is generated from, including inside the
          # image, which copies the committed document. A drift in any of those still
          # fails here; a version that has not been tagged yet does not.
          #
          # Both documents. The full one is what the UI's client is generated from; the
          # integration subset is what other software is invited to depend on, and a
          # check naming only the first would let the published contract drift while
          # reporting success. See docs/decisions.md D-29.
          status=0
          for doc in clients/web-ui/Dexicon.json clients/web-ui/Dexicon_integration.json; do
            jq -S '.info.version = "stamped"' "$doc"          > /tmp/built.json
            git show "HEAD:$doc" | jq -S '.info.version = "stamped"' > /tmp/committed.json
            if ! diff -q /tmp/committed.json /tmp/built.json > /dev/null; then
              echo "::error::$doc is stale. Run a build and commit it."
              diff /tmp/committed.json /tmp/built.json || true
              status=1
            fi
          done
          exit $status

      - name: Install UI dependencies
        working-directory: clients/web-ui
        run: npm ci

      # src/generated/ is gitignored — it is built from Dexicon.json, not committed — so a
      # clean checkout has no API client and anything that compiles src/ fails on it. This
      # has to come before the type-check and the tests, and did not have to before only
      # because the type-check was compiling nothing.
      - name: Generate the API client
        working-directory: clients/web-ui
        run: npm run generate

      # `tsc -b`, NOT `tsc --noEmit`. The root tsconfig is a solution file — `files: []`
      # plus a project reference — so `tsc --noEmit` compiles nothing and exits 0 on code
      # that does not type-check at all. This step passed for every commit it ever ran on,
      # including ones with genuine type errors in src/.
      - name: Type-check UI
        working-directory: clients/web-ui
        run: npm run typecheck

      - name: Test UI
        working-directory: clients/web-ui
        run: npm test

      - name: Build UI
        working-directory: clients/web-ui
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history. A secret removed in the last commit is still a secret, and
          # scanning only the diff is scanning the one place it is not.
          fetch-depth: 0

      # `gitleaks detect` walks the whole git log. The action does not: on a push it
      # scans the commits in that push, so the comment above described a guard this job
      # did not have. A token-shaped fixture sat in tests/ for a day across a dozen green
      # pushes and was only caught when a history rewrite made every commit new to it --
      # a real secret committed and removed across two pushes would have slipped the same
      # way. Running the binary makes the scan match what is claimed, and drops a
      # third-party action from a job whose whole purpose is to be trusted.
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          url="${url}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xzf - gitleaks
          ./gitleaks version
          # --redact so a real finding does not print the secret into a public log.
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  supply-chain:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/web-ui/package-lock.json

      - run: dotnet restore

      # --include-transitive: a vulnerability two levels down is still in the image.
      # dotnet exits 0 even when it finds something, so the output is the signal.
      - name: .NET vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: npm audit
        working-directory: clients/web-ui
        run: |
          npm ci
          npm audit --audit-level=high

  image:
    name: Container image
    runs-on: ubuntu-latest
    # Pull requests only. On main and on a tag the release workflow builds the same image,
    # verifies it the same way and then publishes it, so doing it here too would be the
    # same minutes spent twice.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Built, not pushed. Publishing is a release concern; this only answers "does the
      # Dockerfile still work", which is a question every PR should answer — the image is
      # the deliverable, and a green test suite says nothing about it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dexicon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The stack has to come up, not merely compile. Ollama pulls a model on first run,
      # so only the two services that start cold are checked here; a full stack rehearsal
      # belongs in a scheduled job, not on every PR.
      - name: Start Qdrant and Dexicon
        run: |
          docker network create dexicon-ci
          docker run -d --name qdrant --network dexicon-ci \
            -e QDRANT__SERVICE__API_KEY=ci-key qdrant/qdrant:v1.16.3
          docker run -d --name dexicon --network dexicon-ci -p 8477:8477 \
            -e DEXICON__QDRANT__ENDPOINT=http://qdrant:6334 \
            -e DEXICON__QDRANT__APIKEY=ci-key \
            -e DEXICON__OLLAMA__ENDPOINT=http://unreachable:11434 \
            dexicon:ci

      # Liveness only. Ollama is deliberately unreachable above, so readiness would
      # fail — and that it STILL serves /healthz/live is the point: a missing embedder
      # degrades the service, it does not stop it starting.
      - name: Wait for liveness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8477/healthz/live >/dev/null 2>&1; then
              echo "live after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Container never became live"
          docker logs dexicon
          exit 1

      - name: Unauthenticated requests are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8477/api/corpora)
          [ "$code" = "401" ] || { echo "::error::Expected 401, got $code"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker logs dexicon
