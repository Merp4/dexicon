name: Release

# Publishes the container image. CI proves the Dockerfile still works on every PR; this
# is what produces something anyone can actually pull — docker-compose.yml and
# docs/09-deployment.md have always named `ghcr.io/<owner>/dexicon`, and until this
# existed nothing wrote it, so following the deployment guide on a clean machine failed.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest

    permissions:
      # write, not read: a tag push also cuts the GitHub Release whose body is that
      # version's CHANGELOG section.
      contents: write
      packages: write
      # Provenance: what built this image, from which commit. Worth having from the
      # first release rather than retrofitted after someone asks.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, for MinVer.
          fetch-depth: 0

      - name: Image name
        id: image
        # GHCR rejects an upper-case path and this repository has one.
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ env.REGISTRY }}/${{ github.repository }}

      - name: Version
        id: version
        # The git tag without its `v`, stamped into the assembly so the OpenAPI document
        # and the MCP server report the same number as the image tag. An untagged build
        # of main is not a release and says so.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        id: notes
        # Read here, at the top, rather than next to the release that consumes them. A
        # tag with no CHANGELOG section is a mistake worth stopping the release for, and
        # stopping it is only possible before anything has been pushed to the registry.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # The section runs from its own heading to the next one. Matched by string
          # prefix rather than by regex: a version is full of dots, and a regex would
          # need them escaped to stop `0.2.2` matching `0x2x2`. The trailing space is
          # what stops it matching `0.2.20`.
          awk -v ver="$VERSION" '
            index($0, "## " ver " ") == 1 || $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No section for $VERSION. A tagged release needs one."
            exit 1
          fi

          echo "Release notes for $VERSION:"
          cat release-notes.md

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
          # No bare `{{major}}`: before 1.0 the minor is the breaking change, so a `0`
          # tag would promise compatibility across releases that do not have it.
          # `latest=auto` puts `latest` on release tags only, never on a main build and
          # never on a prerelease.
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=Dexicon
            org.opencontainers.image.description=Local-first semantic indexing and search, over MCP.
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      # ── Verify before publishing ──────────────────────────────────────────
      # One architecture, loaded locally, started for real. A multi-platform build cannot
      # be `load`ed, so the check has to happen on its own build — which costs nothing,
      # because the layers are shared with the push below through the same cache. The
      # alternative is publishing an image nobody has ever started.
      - name: Build for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dexicon:verify
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It starts, and it refuses anonymous requests
        run: |
          docker network create dexicon-verify
          docker run -d --name qdrant --network dexicon-verify \
            -e QDRANT__SERVICE__API_KEY=verify-key qdrant/qdrant:v1.16.3
          docker run -d --name dexicon --network dexicon-verify -p 8477:8477 \
            -e DEXICON__QDRANT__ENDPOINT=http://qdrant:6334 \
            -e DEXICON__QDRANT__APIKEY=verify-key \
            -e DEXICON__OLLAMA__ENDPOINT=http://unreachable:11434 \
            dexicon:verify

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8477/healthz/live >/dev/null 2>&1; then
              echo "live after ${i}s"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::Image never became live; not publishing"
              docker logs dexicon
              exit 1
            fi
            sleep 1
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8477/api/corpora)
          [ "$code" = "401" ] || { echo "::error::Expected 401, got $code"; docker logs dexicon; exit 1; }

          # The version INSIDE the image is the version about to be tagged. deps.json
          # carries it verbatim from the assembly, so a build arg that never reached the
          # publish surfaces here — rather than as an image tag quietly claiming to hold
          # something it does not.
          reported=$(docker run --rm --entrypoint sh dexicon:verify -c \
            'tr "," "\n" < /app/Dexicon.deps.json | sed -n "s|.*\"Dexicon/\([^\"]*\)\".*|\1|p" | head -1')
          echo "image reports version ${reported}"
          if [ "$reported" != "${{ steps.version.outputs.value }}" ]; then
            echo "::error::Image contains ${reported} but would be tagged ${{ steps.version.outputs.value }}"
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker logs dexicon || true

      # ── Publish ───────────────────────────────────────────────────────────
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 costs almost nothing here: both builder stages run on the native
          # builder and emit architecture-independent IL, so only the small runtime
          # layer differs. See the Dockerfile.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          # An SBOM and build provenance, attached to the image in the registry. These are
          # registry artefacts rather than GitHub attestations, so unlike the step below
          # they work for a private repository too — which makes "what is in this image"
          # answerable today rather than after someone asks.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        id: attest
        # The attestation API refuses to persist one for a private repository under a user
        # account: "Feature not available for user-owned private repositories." Attesting
        # happens AFTER the push, so failing here does not stop a release — it just marks
        # a successful publish as failed, which is worse than not attesting.
        #
        # Checked as `== 'public'` rather than `!= 'private'` so that an unexpected or
        # missing value skips the step instead of failing it. Make the repository public
        # and this turns itself on; the summary below always says which happened, so a
        # missing attestation is never silent.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub Release
        # Only a tag is a release; a push to main publishes an `edge` image and nothing
        # else. Runs after the push so the body can name the digest that was actually
        # published, and re-runnable because `workflow_dispatch` on an existing tag
        # would otherwise fail on a release that is already there.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo
            echo '---'
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Digest \`${DIGEST}\`. An SBOM and build provenance are attached to the"
            echo "image in the registry."
          } >> release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: What was published
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "SBOM and build provenance are attached to the image in the registry:"
            echo
            echo '```'
            echo "docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }} --format '{{ json .SBOM }}'"
            echo '```'
            echo
            if [ "${{ steps.attest.outcome }}" = "success" ]; then
              echo "A GitHub provenance attestation was recorded too."
            else
              echo "> **No provenance attestation.** The API only persists one for public"
              echo "> repositories (and org-owned private ones). Make this repository"
              echo "> public and the next release will carry it."
            fi
            echo
            echo "Pin a deployment to a version, or to the digest above:"
            echo
            echo '```'
            echo "DEXICON_TAG=${{ steps.version.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
