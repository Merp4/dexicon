name: Feature request
description: Something Dexicon should do and does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        [docs/11-roadmap.md](https://github.com/Merp4/dexicon/blob/main/docs/11-roadmap.md)
        has an M5 list of things deliberately not started until someone asks with a
        concrete case. If yours is on it, say so — that IS the trigger.

        [docs/decisions.md](https://github.com/Merp4/dexicon/blob/main/docs/decisions.md)
        records what was rejected and why. Arguing with one of those is welcome; it just
        helps to start from the reasoning already there.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What you were trying to do when you wanted this. The concrete case matters more
        than the proposed feature — it usually suggests a smaller change.
    validations: { required: true }

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations: { required: true }

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A problem with no proposed solution is still a good issue.
