# gitleaks configuration.
#
# Runs as a pre-commit hook AND as a CI job over full history. Both, deliberately: the
# hook is convenience and can be skipped with --no-verify, so it cannot be the guard. The
# CI job over the whole history is the guard.

title = "Dexicon"

[extend]
# Start from the maintained rule set — AWS keys, GitHub tokens, private keys and the rest
# — and add what is specific to this project. Replacing it would mean re-deriving a
# hundred rules that someone else already maintains.
useDefault = true

[[rules]]
id = "dexicon-api-token"
description = "Dexicon API token"
# Format is dex_<ulid>_<secret>, from TokenService.Prefix. The token is shown once and
# stored as PBKDF2, so a literal one in the repository is a token that escaped the one
# place it was ever supposed to exist.
regex = '''dex_[0-9A-HJKMNP-TV-Z]{26}_[A-Za-z0-9_-]{20,}'''
keywords = ["dex_"]

[[rules]]
id = "dexicon-bootstrap-token-assigned"
description = "Bootstrap token given a value outside .env"
# DEXICON_BOOTSTRAP_TOKEN= with a REAL token after it. .env.example ships it EMPTY and
# .env is gitignored, so an assigned value in a tracked file is a secret in the repository.
#
# The value has to look like `dex_…` because TokenService.AdoptAsync refuses anything else
# — a bootstrap token without the prefix is not a token the verifier would ever recognise,
# so it is not a credential either.
#
# `\s*=\s*\S+` was too loose in both directions, and a rule that fires on code is a rule
# people learn to wave through. It matched newlines, so the EMPTY assignment in
# .env.example ran on into the next line and reported itself; and `\S+` matched the `")`
# in `line.startswith("DEXICON_BOOTSTRAP_TOKEN=")`, so every script that reads the variable
# was a finding. Four of the scanner's four hits on full history were this rule matching
# code that names the variable and holds no value at all.
regex = '''DEXICON_BOOTSTRAP_TOKEN[ \t]*=[ \t]*["']?dex_[^\s"']+'''
keywords = ["DEXICON_BOOTSTRAP_TOKEN"]

[[rules]]
id = "embedding-provider-key-assigned"
description = "Embedding provider API key given a value"
# Providers are configured with the NAME of an environment variable, never the key. A
# value here means the split that keeps appsettings.json committable has been broken.
regex = '''(OPENAI_API_KEY|AZURE_OPENAI_API_KEY|.*__APIKEY)\s*=\s*["']?[A-Za-z0-9_\-]{16,}'''
keywords = ["OPENAI_API_KEY", "AZURE_OPENAI_API_KEY", "APIKEY"]

[allowlist]
description = "Known-safe matches"

# NO `paths` here, deliberately. A path in the GLOBAL allowlist is exempt from every rule
# — including the default set's AWS keys, GitHub tokens and private keys — not merely from
# the project rules it was meant to quiet. That exempted all of docs/ and README.md from
# the scan this repository calls its guard, so the one file type a credential is most
# likely to be pasted into while writing an example was the one file type nothing checked.
#
# The documentation quotes token SHAPES rather than tokens, and the regexes below already
# cover every placeholder it uses, so nothing needed the exemption in the first place.

# Test the allowlist against the WHOLE match, not against the secret gitleaks extracted
# from it. The default target is the secret, and for a rule with no capture group that can
# be just the left-hand side: `embedding-provider-key-assigned` handed the allowlist
# `$env:DEXICON__QDRANT__APIKEY` and kept the value to itself, so the entry below for the
# compose default never suppressed anything and the known-safe line was a finding.
regexTarget = "match"

regexes = [
  # The placeholder used throughout the docs and the UI.
  '''dex_\.\.\.''',
  '''dex_…''',
  '''Bearer dex_\.\.\.''',
  # The compose default for Qdrant, which is not a secret and is documented as not being
  # one: the port is never published. See docs/09-deployment.md.
  '''dexicon-local-dev-key''',
  # The fabricated token in SecretHygieneTests, which asserts that a principal cache key
  # never contains the credential it was derived from. Token-SHAPED on purpose: a fixture
  # that did not look like a token would not exercise the thing under test. Pinned to the
  # exact literal rather than exempting the file, so a real token pasted into that same
  # test is still a finding.
  '''dex_01JBXQZ9K7MNPRSTVWXYZ01234_a-secret-nobody-should-read''',
]
